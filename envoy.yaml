static_resources:
  listeners:
    - name: grpc_listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8080
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: ingress_http
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: grpc_services
                      domains: ["*"]
                      typed_per_filter_config:
                        envoy.filters.http.cors:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.CorsPolicy
                          allow_origin_string_match:
                            - safe_regex:
                                regex: ".*"
                          allow_methods: "GET, PUT, POST, DELETE, OPTIONS"
                          allow_headers: "keep-alive,user-agent,cache-control,content-type,content-transfer-encoding,authorization,x-app-id,x-requested-with"
                          expose_headers: "grpc-status,grpc-message"
                          max_age: "1728000"
                      routes:
                        # --- SSO (специфичные пути ДО общего "/v1/") ---
                        - match:
                            prefix: "/v1/auth/"
                          route:
                            cluster: cluster_sso
                        - match:
                            prefix: "/v1/users"
                          route:
                            cluster: cluster_sso
                        - match:
                            prefix: "/v1/create_users"
                          route:
                            cluster: cluster_sso
                        # --- Journal (catch-all для остальных /v1/, держать ПОСЛЕДНИМ среди /v1) ---
                        - match:
                            prefix: "/v1/"
                          route:
                            cluster: cluster_journal
                        # --- gRPC-нативные пути (не пересекаются с /v1/) ---
                        - match:
                            prefix: "/grpc.reflection.v1.ServerReflection/"
                          route:
                            cluster: cluster_sso
                        - match:
                            prefix: "/sso.v1.Auth/"
                          route:
                            cluster: cluster_sso
                        - match:
                            prefix: "/journal.v1."
                          route:
                            cluster: cluster_journal
                http_filters:
                - name: envoy.filters.http.cors
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
                - name: envoy.filters.http.grpc_json_transcoder
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.grpc_json_transcoder.v3.GrpcJsonTranscoder
                    proto_descriptor: "/etc/envoy/combined_descriptor.pb"
                    services:
                      - "sso.v1.Auth"
                      - "journal.v1.StudentService"
                      - "journal.v1.TeacherService"
                      - "journal.v1.ClassesService"
                      - "journal.v1.SubjectService"
                      - "journal.v1.GradesService"
                      - "journal.v1.HomeworkService"
                      - "journal.v1.StatusCodeService"
                      - "journal.v1.TeachingLoadService"
                    print_options:
                      add_whitespace: true
                      always_print_primitive_fields: true
                      preserve_proto_field_names: false
                    request_validation_options:
                      reject_unknown_query_parameters: false
                    match_incoming_request_route: true
                    convert_grpc_status: true
                - name: envoy.filters.http.router
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router

  clusters:
    - name: cluster_journal
      connect_timeout: 0.25s
      type: LOGICAL_DNS
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: cluster_journal
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: journal-service
                      port_value: 4043

    - name: cluster_sso
      connect_timeout: 0.25s
      type: LOGICAL_DNS
      lb_policy: ROUND_ROBIN
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          explicit_http_config:
            http2_protocol_options: {}
      load_assignment:
        cluster_name: cluster_sso
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: sso-service
                      port_value: 4042
